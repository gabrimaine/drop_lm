# MyST configuration for the analysis report (https://mystmd.org/).
# The MySTRA plugin resolves {astra}`...` references against astra.yaml.
# Both MySTRA and the ASTRA article theme are pinned so the report builds the
# same way later. MySTRA v0.0.8 reads ASTRA spec 0.0.14, which is what
# astra.yaml declares; MySTRA 0.1.x needs an ASTRA 0.1 spec.
version: 1
project:
  title: Fitting a lipid-droplet lens with the Deslandes-Thiam-Foret model
  authors:
    - name: Gabriele Mainetti
      affiliations:
        - SLAC National Accelerator Laboratory
  github: https://github.com/gabrimaine/drop_lm
  bibliography:
    - references.bib
  plugins:
    - https://github.com/LightconeResearch/MySTRA/releases/download/v0.0.8/mystra.mjs
  toc:
    - file: index.md
  exclude:
    - README.md
    - results/README.md
site:
  # ASTRA article theme, pinned to v0.0.16 (the last release before MySTRA 0.1).
  # MyST caches it under _build/templates/; run `myst clean --templates` after
  # changing this line.
  template: https://github.com/LightconeResearch/astra-article-theme/archive/refs/tags/v0.0.16.zip
